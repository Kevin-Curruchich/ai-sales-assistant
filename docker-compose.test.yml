services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: revenew
      POSTGRES_PASSWORD: revenew
      POSTGRES_DB: revenew_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenew -d revenew_test"]
      interval: 2s
      timeout: 3s
      retries: 15
