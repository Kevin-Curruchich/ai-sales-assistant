services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: revenew
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: revenew_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenew -d revenew_test"]
      interval: 2s
      timeout: 3s
      retries: 15
